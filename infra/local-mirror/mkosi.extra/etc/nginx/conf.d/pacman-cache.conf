server {
    listen      50001;
    listen      [::]:50001;
    server_name _;
    root        /srv/mirror/http/pacman-cache;
    autoindex   on;

    location ~ \.(db|sig|files)$ {
        proxy_pass http://archlinux_mirrors$request_uri;
    }

    location ~ \.tar\.(xz|zst)$ {
        try_files $uri @pkg_mirror;
    }

    location @pkg_mirror {
        proxy_store    on;
        proxy_redirect off;
        proxy_store_access  user:rw group:rw all:r;
        proxy_next_upstream error timeout http_404;
        proxy_pass          http://archlinux_mirrors$request_uri;
    }
}

upstream archlinux_mirrors {
    server 127.0.0.1:8001;
    server 127.0.0.1:8002 backup;
    server 127.0.0.1:8003 backup;
    server 127.0.0.1:8004 backup;
}

server {
    listen      127.0.0.1:8001;

    location / {
        proxy_pass          http://mirror.arizona.edu/archlinux$request_uri;
    }
}

server {
    listen      127.0.0.1:8002;

    location / {
        proxy_pass          http://mirrors.kernel.org/archlinux$request_uri;
    }
}

server {
    listen      127.0.0.1:8003;

    location / {
        proxy_pass          http://us.mirrors.cicku.me/archlinux$request_uri;
    }
}

server {
    listen      127.0.0.1:8004;

    location / {
        proxy_pass          http://arch.mirror.constant.com$request_uri;
    }
}
