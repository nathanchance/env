server {
    listen      50002;
    listen      [::]:50002;
    server_name _;
    root        /srv/mirror/http/fedora;
    autoindex   on;

    location ~ \.xml(?:\.zck|\.zst)?$ {
        proxy_pass http://fedora_mirrors$request_uri;
    }

    location ~ \.rpm$ {
        try_files $uri @rpm_mirror;
    }

    location @rpm_mirror {
        proxy_store    on;
        proxy_redirect off;
        proxy_store_access  user:rw group:rw all:r;
        proxy_next_upstream error timeout http_404;
        proxy_pass          http://fedora_mirrors$request_uri;
    }
}

upstream fedora_mirrors {
    server 127.0.0.1:50101;
    server 127.0.0.1:50102 backup;
    server 127.0.0.1:50103 backup;
}

server {
    listen      127.0.0.1:50101;

    location / {
        proxy_pass      http://fedora.mirror.constant.com/fedora$request_uri;
    }
}

server {
    listen      127.0.0.1:50102;

    location / {
        proxy_pass      http://mirror.fcix.net/fedora$request_uri;
    }
}

server {
    listen      127.0.0.1:50103;

    location / {
        proxy_pass      http://mirror.shomepower.com/fedora$request_uri;
    }
}
