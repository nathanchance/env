server {
    listen      50003;
    listen      [::]:50003;
    server_name _;
    root        /srv/mirror/http/releases.astral.sh;
    autoindex   on;

    location ~ \.ndjson?$ {
        proxy_pass http://astral_mirrors$request_uri;
    }

    location / {
        try_files $uri @astral_mirror;
    }

    location @astral_mirror {
        proxy_store    on;
        proxy_redirect off;
        proxy_store_access  user:rw group:rw all:r;
        proxy_next_upstream error timeout http_404;
        proxy_pass          http://astral_mirrors$request_uri;
    }
}

upstream astral_mirrors {
    server 127.0.0.1:50111;
}

server {
    listen      127.0.0.1:50111;

    location / {
        proxy_pass      http://releases.astral.sh$request_uri;
    }
}
